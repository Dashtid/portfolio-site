    <!-- No static canonical link here, deliberately. Every public view sets its
         own via useHead and unhead replaces rather than appends, so a static one
         never reached a page that had its own — it only reached a page that
         FORGOT one, and then aimed it at the homepage, asking Google to fold
         that page away. That is how /404 came to canonicalize to the homepage
         (D3-CNT-02 regression class). No canonical self-canonicalizes, which is
         the safe default; a wrong inherited one is not. -->

    <!-- Security headers (CSP, X-Frame-Options, HSTS, ...) come from the
         Vercel edge — frontend/vercel.json "headers" — NOT the backend.
         script-src AND style-src are hash-locked: 'self' plus pinned
         SHA-256 hashes, no 'unsafe-inline' anywhere. The build-varying
         __INITIAL_STATE__ that once forced 'unsafe-inline' is now a
         non-executing JSON data block (vite.config onFinished, D3-SEC-03),
         so no per-build hash is ever needed. Each hash has a named owner in
         tests/unit/cspHashes.spec.ts — change an inline block and that
         suite tells you the new hash. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Pre-hydration theme. Vue's useDark() only runs after hydration, so
         without this block users with a saved `dark` preference see a
         light-mode flash on every page load. This sets data-theme on <html>
         before first paint, matching what useDark() will compute on the
         client. Storage key + values mirror composables/useTheme.ts.
         NOTE: useDark persists the literal string 'auto' whenever the chosen
         mode equals the system preference (its most common state) — 'auto'
         matches no CSS selector, so anything that isn't exactly
         'dark'/'light' must resolve to the system preference here. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme =
            stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          /* localStorage / matchMedia may be unavailable; fall through */
        }
      })()
    </script>
