version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # fastapi is CAPPED <0.137 in pyproject.toml. 0.137.0 introduced
      # _IncludedRouter (lazy include_router), which breaks slowapi's
      # _find_route_handler — it needs route.endpoint, gets None, and
      # _should_exempt(None) returns True, so RATE_LIMIT_DEFAULT goes
      # silently dead on every /api/v1 route. It also regresses
      # performance.py's _resolve_route_template to per-URL metric keys.
      # Without this ignore the python-minor group PR regenerates weekly
      # carrying a version the cap can never accept (see PR #128).
      # Lift together with the pyproject cap, and only once
      # test_undecorated_included_route_enforces_default_limit passes —
      # slowapi 0.1.10 (Jun 2026) still does NOT resolve via scope['route'].
      - dependency-name: "fastapi"
        versions: [">=0.137"]
    # D3-CI-02: 7-day cooldown before adopting fresh releases — the window
    # in which hijacked-package incidents are typically caught and yanked.
    # Dependabot security updates bypass cooldown automatically, so known
    # CVE fixes still arrive immediately.
    cooldown:
      default-days: 7

  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # @types/node must track the Node MAJOR we actually build and run on
      # (ci-cd.yml NODE_VERSION, currently 24). Types from a newer major
      # describe APIs that do not exist at runtime, so type-check passes and
      # the call still throws in production — the one failure mode a type
      # checker is supposed to prevent. Raise this bound in the same commit
      # that raises NODE_VERSION, never before (see PR #122, which proposed
      # @types/node 26 against a Node 24 runtime).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @unhead/vue is not ours to bump: vite-ssg 28.3.0 declares
      # `@unhead/dom ^2.1.2` and `@unhead/vue ^2.1.2` as hard DEPENDENCIES
      # (not peers), so taking unhead 3 installs a second copy and the head
      # management the prerender depends on splits across two instances.
      # Re-check on the next vite-ssg major; verify with
      # `node -e "console.log(require('vite-ssg/package.json').dependencies)"`
      # rather than assuming, then lift this. (See PR #133.)
      - dependency-name: "@unhead/vue"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native/Go port) is blocked by hard evidence, not
      # assumption (experiment run 2026-08-03): installing typescript@7.0.2
      # makes vue-tsc crash before checking a single file with
      # ERR_PACKAGE_PATH_NOT_EXPORTED — TS7 no longer exports ./lib/tsc,
      # which vue-tsc patches at require-time — and
      # @typescript-eslint/parser peers ">=4.8.4 <6.1.0". Lift when BOTH
      # vue-tsc supports TS7 (rerun: npm i --no-save typescript@7 &&
      # npx vue-tsc --noEmit) and typescript-eslint widens its peer range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"

  # Docker base image (D3-CI-02): backend/Dockerfile digest-pins
  # python:3.13-slim, but nothing bumped the digest — trivy fs never scans
  # the image OS layer, so base-image CVEs accumulated silently. Dependabot
  # keeps the digest current; Fly rebuilds from it on each deploy.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
