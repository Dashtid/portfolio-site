name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC
  push:
    branches: ["main"]

permissions: read-all

jobs:
  # The action's own metadata runs its image by tag, which the SHA pin does
  # not fix; this job holds that tag to the digest recorded under the pin
  # before the analysis pulls it. Publishing needs the analysis job to hold
  # nothing but `uses:` steps, so the check is a job of its own.
  image-pin:
    name: Scorecard image pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the image digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_action_pins.py --only ossf/scorecard-action

  analysis:
    name: Scorecard analysis
    needs: image-pin
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code-scanning
      id-token: write # publish_results: true (sigstore signing)
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        # SHA must be the action's commit SHA, not the tag-object SHA --
        # api.securityscorecards.dev rejects tag-object SHAs as
        # "imposter commits" during webapp publish verification.
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        # The image the pinned action.yaml names; move it with the action.
        # image: ghcr.io/ossf/scorecard-action:v2.5.0@sha256:1e1481c65fc2407d3fd6ab18a23c741eb4d1c0d9359ebafc4b3ab13aa61d8627
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to api.securityscorecards.dev so the badge in README
          # auto-populates (uses the OIDC token from id-token: write).
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
