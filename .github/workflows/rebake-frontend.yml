# D3-INF-02: one-click republish for CMS content edits.
#
# The SSG bake reads api.dashti.se at build time, and the main pipeline's
# deploy-frontend only runs when frontend/** changes — so a CMS edit
# (companies, education, documents) published nowhere until an unrelated
# frontend commit landed. This workflow rebuilds and redeploys the CURRENT
# main from the GitHub Actions UI (Run workflow button) with zero code
# changes.
#
# Deliberately no CI gates here: a rebake deploys the exact SHA that
# already passed the full pipeline; only the baked API content changes.
# The post-deploy smoke still runs so a rebake can never silently ship
# missing security headers.
name: Rebake Frontend (CMS republish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebake:
    # Main only: a dispatch on another branch would deploy that branch's
    # tree, which no pipeline run has checked.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The group of ci-cd.yml's deploy-frontend too: two production deploys
    # never overlap, so an older tree cannot finish last.
    concurrency:
      group: production-frontend
      cancel-in-progress: false
    environment:
      name: production
      url: https://dashti.se
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Never an npm cache in a job that holds VERCEL_TOKEN.
          package-manager-cache: false

      # The same install and check as ci-cd.yml's deploy-frontend.
      - name: Install Vercel CLI
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/vercel-cli"
          cp .github/tools/vercel/package.json .github/tools/vercel/package-lock.json "${RUNNER_TEMP}/vercel-cli/"
          cd "${RUNNER_TEMP}/vercel-cli"
          npm ci --ignore-scripts --no-audit --no-fund
          test -x node_modules/@vercel/vc-native-linux-x64/bin/vercel
          node_modules/.bin/vercel --version 2>&1 | tee version.txt
          grep -qE '^Vercel CLI [^ ]+ \(native[,)]' version.txt

      # No working-directory: the main pipeline deploys from the repo root
      # (Vercel's Root Directory project setting selects frontend/) — a
      # rebake must upload the identical tree.
      - name: Deploy to Vercel (rebake with fresh CMS content)
        run: |
          "${RUNNER_TEMP}/vercel-cli/node_modules/.bin/vercel" deploy --prod --yes \
            --build-env VITE_APP_VERSION="${GITHUB_SHA:0:12}" \
            --build-env VITE_SENTRY_DSN="$VITE_SENTRY_DSN" \
            --build-env SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN" \
            --build-env SENTRY_ORG="$SENTRY_ORG" \
            --build-env SENTRY_PROJECT="$SENTRY_PROJECT" \
            --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      # The same check as ci-cd.yml's deploy-frontend: every header
      # vercel.json sets for "/(.*)", exactly, on three pages.
      - name: Post-deploy security-header smoke
        run: |
          sleep 5
          python3 scripts/check-live-headers.py frontend/vercel.json \
            https://dashti.se/ https://dashti.se/colophon https://dashti.se/admin
