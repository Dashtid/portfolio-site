# Nightly logical backup of the production Postgres (dashti-portfolio-db).
#
# Complements Fly's automatic volume snapshots (5-day retention, restore-
# only-to-new-volume) with portable pg_dump artifacts kept for 30 days.
# Before this workflow existed there was NO durable backup of the DB at
# all — a finding from the 2026-07 full-stack review.
#
# Dumps are age-encrypted before upload (D3-SEC-01, 2026-07-16): this repo
# is PUBLIC, and public-repo artifacts are downloadable by any logged-in
# GitHub account, so plaintext dumps were an open data exposure. The age
# recipient below is a public key — safe to commit; the runner never holds
# decryption capability. The private key lives OFFLINE with the owner
# (password manager). Restore:
#   unzip artifact && age -d -i age-backup-key.txt portfolio-YYYYMMDD.dump.age \
#     > portfolio.dump && pg_restore ...
#
# Required repository secrets:
#   FLY_DB_TOKEN - deploy token: flyctl tokens create deploy -a dashti-portfolio-db
#                  (NOT FLY_API_TOKEN — that one is scoped to the backend
#                  app for deploys; each app gets its own least-privilege
#                  token)
#   DB_PASSWORD  - password of the portfolio_app Postgres user (from the
#                  backend's DATABASE_URL secret)
name: DB Backup

on:
  schedule:
    # 03:30 UTC nightly — after the analytics day rolls over, before CET morning.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # keepalive needs to flip the workflow's enabled bit via the API
  actions: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # GitHub auto-disables scheduled workflows after 60 days without repo
      # activity. This workflow is the ONLY durable DB backup, so silent
      # disablement = silent loss of backups. Re-enabling on every run
      # resets that clock regardless of commit activity.
      - name: Keepalive (reset the 60-day auto-disable clock)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/db-backup.yml/enable"

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Install postgresql client
        # pg_dump must be >= the server's major version (17). The runner
        # image only bakes in an older client .deb — the PGDG apt source
        # itself is not configured — so add it before installing.
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age

      - name: Open proxy to Postgres
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DB_TOKEN }}
        run: |
          flyctl proxy 15432:5432 -a dashti-portfolio-db &
          # Wait for the tunnel to accept connections
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 15432 >/dev/null 2>&1; then
              echo "proxy ready"
              exit 0
            fi
            sleep 2
          done
          echo "proxy never became ready" >&2
          exit 1

      - name: Dump database
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # Versioned path: the runner also ships an older pg_dump, and the
          # Debian wrapper's pick between them is not deterministic.
          /usr/lib/postgresql/17/bin/pg_dump \
            --host 127.0.0.1 --port 15432 \
            --username portfolio_app \
            --dbname dashti_portfolio_backend \
            --format custom \
            --file "portfolio-$(date -u +%Y%m%d).dump"
          ls -la portfolio-*.dump

      - name: Encrypt dump (age, public-key recipient)
        # Plaintext must never reach upload-artifact on this public repo.
        run: |
          age -r age137axkhhga6awtmmpv7lqzkt7fdmlm7pgucqh3rspwysg33whud5skcnkun \
            -o "$(ls portfolio-*.dump).age" "$(ls portfolio-*.dump)"
          shred -u portfolio-*.dump
          ls -la portfolio-*.dump.age

      - name: Upload backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pg-backup-${{ github.run_id }}
          path: portfolio-*.dump.age
          retention-days: 30
          if-no-files-found: error

  # Admin-uploaded PDFs live on the backend's `portfolio_data` Fly volume at
  # /data/uploads/documents (backend/fly.toml [env] UPLOAD_DIR). They are NOT
  # in the Postgres dump and NOT in git — the DB only stores the file_path, so
  # a lost volume means every document link 404s with nothing to restore from.
  # Fly's 60-day volume snapshots were the only copy until this job.
  #
  # Runs independently of the Postgres job: a broken pg proxy must not cost us
  # the uploads backup, and vice versa.
  uploads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      - name: Archive the uploads volume
        env:
          # Scoped to the backend app (the volume's owner), unlike FLY_DB_TOKEN.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          # The tar is built in-memory and base64'd on the machine, then framed
          # between markers: flyctl writes connection banners on the same
          # channel, so anything unframed would corrupt the archive.
          REMOTE=$(cat <<'PY'
          import base64, io, os, sys, tarfile
          buf = io.BytesIO()
          with tarfile.open(fileobj=buf, mode="w:gz") as tf:
              if os.path.isdir("/data/uploads"):
                  tf.add("/data/uploads", arcname="uploads")
          sys.stdout.write("-----B64-START-----")
          sys.stdout.write(base64.b64encode(buf.getvalue()).decode())
          sys.stdout.write("-----B64-END-----\n")
          PY
          )
          ENCODED=$(printf '%s' "$REMOTE" | base64 -w0)
          flyctl ssh console -a dashti-portfolio-backend \
            -C "python -c \"import base64;exec(base64.b64decode('${ENCODED}'))\"" \
            > raw-output.txt

          # Extract strictly between the markers.
          sed -n 's/.*-----B64-START-----\(.*\)-----B64-END-----.*/\1/p' \
            raw-output.txt | tr -d '\r\n' > uploads.b64
          if [ ! -s uploads.b64 ]; then
            echo "No framed payload in flyctl output — archive step failed." >&2
            head -c 2000 raw-output.txt >&2
            exit 1
          fi
          base64 -d uploads.b64 > "uploads-$(date -u +%Y%m%d).tar.gz"
          rm -f raw-output.txt uploads.b64

          # Prove the archive is readable before it is encrypted; a corrupt
          # tar that only fails at restore time is worse than no backup.
          ARCHIVE="$(ls uploads-*.tar.gz)"
          tar -tzf "$ARCHIVE" > listing.txt
          COUNT=$(grep -c . listing.txt || true)
          echo "Archived ${COUNT} entries from /data/uploads:"
          head -20 listing.txt
          if [ "$COUNT" -eq 0 ]; then
            echo "Archive is empty — /data/uploads missing on the machine?" >&2
            exit 1
          fi

      - name: Encrypt archive (age, same public-key recipient as the DB dump)
        run: |
          set -euo pipefail
          ARCHIVE="$(ls uploads-*.tar.gz)"
          age -r age137axkhhga6awtmmpv7lqzkt7fdmlm7pgucqh3rspwysg33whud5skcnkun \
            -o "${ARCHIVE}.age" "${ARCHIVE}"
          shred -u uploads-*.tar.gz
          ls -la uploads-*.tar.gz.age

      - name: Upload uploads artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uploads-backup-${{ github.run_id }}
          path: uploads-*.tar.gz.age
          retention-days: 30
          if-no-files-found: error
