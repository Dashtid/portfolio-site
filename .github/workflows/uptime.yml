# Uptime + database-health monitor (SECOND opinion, not the only one).
#
# The June 2026 incident: Postgres was down for 21 hours and nothing
# noticed, because the Fly health check hit a shallow /health that never
# touched the DB and no alerting existed anywhere. The Fly check now hits
# /health/ready (DB SELECT 1), and this workflow adds an external probe:
# when a check fails, the job fails, and GitHub emails the repo owner.
#
# [!] Two earlier claims in this header were retired 2026-09-20. This is NOT
# "the only uptime alerting" and it is NOT the only "external" probe: an
# UptimeRobot account has watched dashti.se and HEAD /api/v1/health/ready
# since 2026-08-13 (c13a46c made the health routes answer HEAD for exactly
# that). Two overlapping channels is fine; two NOISY channels is not, which
# is why the interval below is hourly rather than every 15 minutes. Zero
# secrets and zero third-party dependencies is still true of this file, and
# is still the reason to keep it: it survives an UptimeRobot account lapse.
name: Uptime Check

on:
  schedule:
    # Hourly at :17. Was '*/15 * * * *', which cost ~13 notifications a day
    # for no marginal signal: GitHub throttles scheduled runs under load, so
    # the observed spacing was already ~110 min, not 15. Detection is
    # therefore unchanged in practice while run volume drops ~4x. Off-the-hour
    # because :00 is GitHub's busiest cron slot and gets delayed hardest.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job runs the keepalive, so the workflow-enable scope lives
    # here rather than at top level (Scorecard TokenPermissions scores a
    # top-level 'actions: write' as 0 - every job would inherit it).
    permissions:
      contents: read
      actions: write
    steps:
      # GitHub auto-disables scheduled workflows after 60 days without repo
      # activity. This is the ONLY uptime alerting — silent disablement means
      # a repeat of the invisible 21-hour June outage. Same pattern as
      # db-backup.yml.
      - name: Keepalive (reset the 60-day auto-disable clock)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/uptime.yml/enable"

      - name: API readiness (hits the database)
        run: |
          curl --silent --show-error --fail \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 20 \
            https://api.dashti.se/api/v1/health/ready \
            | tee /tmp/ready.json
          # Belt-and-braces: assert the body actually says ready.
          grep -q '"status":[[:space:]]*"ready"' /tmp/ready.json

      - name: Frontend serves HTML
        run: |
          curl --silent --show-error --fail \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 20 \
            --output /dev/null \
            https://dashti.se/
