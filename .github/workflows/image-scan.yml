# Weekly scan of the image the backend runs on, for known vulnerabilities
# that have a fix.
#
# Fly builds the production image from backend/Dockerfile at deploy time, on
# the digest-pinned base of its last FROM. The runtime stage installs no OS
# packages, so production's Debian packages and its CPython (built into
# /usr/local) are the base's; the Python packages added on top come from
# backend/requirements.txt, which ci-cd.yml's Trivy scan reads. Trivy's image
# scan reports no CPython package, so this job runs grype, which matches the
# Debian packages and the CPython binary alike. High and Critical matches
# with a fix go to code scanning, and the last step fails while one remains:
# the signal to move the base to a newer digest. No deploy waits for this
# workflow. GitHub sends a scheduled run's notifications to the user who
# last modified its cron line.
name: Backend image scan

on:
  schedule:
    # 06:30 UTC every Monday.
    - cron: '30 6 * * 1'
  # The scan reads only the base image the Dockerfile pins.
  push:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - '.github/workflows/image-scan.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - '.github/workflows/image-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload
    env:
      # The scanner, by digest: Docker runs the digest, and the tag only names
      # it. Move both together, from
      #   docker buildx imagetools inspect ghcr.io/anchore/grype:<vX.Y.Z>
      GRYPE_IMAGE: ghcr.io/anchore/grype:v0.122.0@sha256:013e16ae96bd64108973e3e9fecec63f7ff276358d34c46c25d33e2aac96539f
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the runtime base image from the Dockerfile
        id: base
        run: |
          set -euo pipefail
          # The last FROM starts the runtime stage, the image production runs.
          ref=$(awk '$1 == "FROM" { image = $2 } END { print image }' backend/Dockerfile)
          if ! grep -qxE '[^@[:space:]]+@sha256:[0-9a-f]{64}' <<< "${ref}"; then
            echo "::error file=backend/Dockerfile::the runtime FROM is not pinned by digest: '${ref}'"
            exit 1
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Scan the base image
        env:
          IMAGE_REF: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/grype"
          # Read from the registry for linux/amd64, the platform Fly runs, and
          # keep only matches with a fix: no newer base removes the others.
          docker run --rm -v "${RUNNER_TEMP}/grype:/work" \
            -e GRYPE_DB_CACHE_DIR=/work/db -e GRYPE_CHECK_FOR_APP_UPDATE=false \
            "${GRYPE_IMAGE}" "registry:${IMAGE_REF}" --platform linux/amd64 --only-fixed \
            -o table -o sarif=/work/grype.sarif

      - name: Keep the High and Critical matches
        run: |
          python3 - "${RUNNER_TEMP}/grype/grype.sarif" "${RUNNER_TEMP}/grype/high.sarif" <<'PY'
          import json
          import sys

          source, target = sys.argv[1:3]
          with open(source, encoding="utf-8") as handle:
              sarif = json.load(handle)
          for run in sarif["runs"]:
              # grype gives High and Critical matches the level "error". The
              # rules stay as they are, so any index into them still holds.
              run["results"] = [r for r in run.get("results", []) if r.get("level") == "error"]
          with open(target, "w", encoding="utf-8") as handle:
              json.dump(sarif, handle)
          PY

      - name: Upload the matches to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/grype/high.sarif
          category: grype-image

      - name: Fail while a High or Critical match has a fix
        run: |
          python3 - "${RUNNER_TEMP}/grype/high.sarif" <<'PY'
          import json
          import sys

          FIX = "move both FROM lines of backend/Dockerfile to a newer digest of the tag"
          with open(sys.argv[1], encoding="utf-8") as handle:
              runs = json.load(handle)["runs"]
          results = [result for run in runs for result in run.get("results", [])]
          for result in results:
              print(f"::error::{result['ruleId']}: {result['message']['text']} - {FIX}")
          print(f"{len(results)} High or Critical match(es) with a fix")
          sys.exit(1 if results else 0)
          PY
