# Pre-commit hooks for portfolio migration project
# See https://pre-commit.com for more information

repos:
  # Block committing environment files outright (D3-SEC-05). Ported from
  # the never-installed .githooks/pre-commit; its grep-based secret-pattern
  # warn is deliberately NOT ported — TruffleHog in CI (security-scan job)
  # owns secret detection with far fewer false positives.
  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid committing .env files
        entry: '.env files must never be committed (use .env.example)'
        language: fail
        files: '(^|/)\.env(\.production)?$'

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/.*\.snap$
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^frontend/.*\.snap$
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: ^frontend/tests/e2e/.*-snapshots/.*\.png$
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: ^frontend/tests/e2e/.*-snapshots/

  # Frontend: Prettier formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/.*\.(js|ts|vue|json|css|scss|md)$
        additional_dependencies:
          - prettier@3.9.6

  # GitHub Actions workflow linting — expression typos, invalid needs/refs,
  # shellcheck on run: blocks. check-yaml above validates YAML syntax only,
  # not Actions semantics; 6 hand-maintained workflows had zero linting.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # Frontend: ESLint
  # Versions kept in lockstep with frontend/package.json (installed tree) —
  # a hook/CI eslint skew silently lints with different rules than CI gates.
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.8.0
    hooks:
      - id: eslint
        files: ^frontend/.*\.(js|ts|vue)$
        exclude: ^frontend/public/sw\.js$
        args: ['--fix', '--config', 'frontend/eslint.config.js']
        additional_dependencies:
          - eslint@10.8.0
          - '@eslint/js@10.0.1'
          - '@typescript-eslint/eslint-plugin@8.65.0'
          - '@typescript-eslint/parser@8.64.0'
          - eslint-plugin-vue@10.10.0
          - eslint-plugin-prettier@5.5.6
          - eslint-config-prettier@10.1.8
          - vue-eslint-parser@10.4.0
          - typescript@5.9.3

  # Backend: Ruff (linting and formatting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Ruff linter
      - id: ruff
        files: ^backend/.*\.py$
        args: ['--fix']
      # Ruff formatter (replaces Black)
      - id: ruff-format
        files: ^backend/.*\.py$

  # Backend: mypy type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^backend/.*\.py$
        additional_dependencies:
          - types-passlib
          - types-python-jose
          - pydantic
          - fastapi
